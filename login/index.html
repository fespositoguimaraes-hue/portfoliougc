<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Entrar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #f6f3ee;
      --paper-warm: #ede5dd;
      --detail: #c4c2bd;
      --green: #859b8a;
      --green-dark: #5a695e;
      --pink: #dd8893;
      --pink-dark: #965c64;
      --ink: #000000;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--paper) 0%, var(--paper-warm) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 24px;
      color: var(--ink);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      color: var(--detail);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--ink);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--detail);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--paper);
      color: var(--ink);
      transition: border-color 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--green);
      background: white;
    }

    .error-box {
      background: #fee;
      border-left: 3px solid var(--pink);
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--pink-dark);
      margin-bottom: 20px;
      display: none;
    }

    .error-box.show {
      display: block;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-entrar {
      background: var(--green);
      color: white;
    }

    .btn-entrar:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .btn-entrar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-recuperar {
      background: var(--detail);
      color: white;
    }

    .btn-recuperar:hover:not(:disabled) {
      background: #b3b0ab;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      font-size: 12px;
      color: var(--detail);
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
    }

    .footer a {
      color: var(--green);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .success-message {
      background: #efe;
      border-left: 3px solid var(--green);
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--green-dark);
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>Admin</h1>
  <p class="subtitle">Painel de controle do portf√≥lio</p>

  <div id="errorBox" class="error-box"></div>
  <div id="successBox" class="success-message"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="seu@email.com"
        required
        autocomplete="email"
      >
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        placeholder="‚Ä¢‚Ä¢‚Ä¢‚Ä¢‚Ä¢‚Ä¢‚Ä¢‚Ä¢"
        required
        autocomplete="current-password"
      >
    </div>

    <div class="button-group">
      <button type="submit" class="btn-entrar" id="btnEntrar">
        Entrar
      </button>
      <button type="button" class="btn-recuperar" id="btnRecuperar">
        Recuperar
      </button>
    </div>
  </form>

  <div class="footer">
    Conectando ao Supabase...<br>
    <span id="status">Carregando</span>
  </div>
</div>

<!-- Supabase via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0"></script>

<!-- Configura√ß√£o do banco -->
<script src="../js/banco.js"></script>

<!-- L√≥gica de login -->
<script>
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const btnEntrar = document.getElementById('btnEntrar');
  const btnRecuperar = document.getElementById('btnRecuperar');
  const statusText = document.getElementById('status');

  let supabase = null;

  // Inicializar Supabase
  async function initSupabase() {
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      statusText.textContent = 'Pronto';

      // Se j√° tem sess√£o aberta, vai pro admin
      const { data: session } = await supabase.auth.getSession();
      if (session?.session) {
        window.location.href = '../admin/';
      }
    } catch (err) {
      statusText.textContent = 'Erro ao conectar';
      console.error('Erro Supabase:', err);
    }
  }

  // Fazer login
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    successBox.classList.remove('show');

    const emailVal = email.value.trim();
    const passVal = password.value;

    if (!emailVal || !passVal) {
      showError('Preencha e-mail e senha');
      return;
    }

    btnEntrar.disabled = true;
    btnEntrar.innerHTML = '<span class="loading"></span>Entrando...';

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailVal,
        password: passVal
      });

      if (error) {
        // Mensagem em portugu√™s pra erro de credenciais
        if (error.message.includes('Invalid login credentials')) {
          showError('E-mail ou senha incorretos');
        } else {
          showError(error.message || 'Erro ao entrar');
        }
      } else if (data?.session) {
        // Sucesso! Vai pro admin
        window.location.href = '../admin/';
      }
    } catch (err) {
      showError('Erro ao conectar ao servidor');
      console.error(err);
    } finally {
      btnEntrar.disabled = false;
      btnEntrar.innerHTML = 'Entrar';
    }
  });

  // Recuperar senha
  btnRecuperar.addEventListener('click', async () => {
    const emailVal = email.value.trim();

    if (!emailVal) {
      showError('Digite seu e-mail primeiro');
      return;
    }

    btnRecuperar.disabled = true;
    btnRecuperar.innerHTML = '<span class="loading"></span>Enviando...';

    try {
      const { error } = await supabase.auth.resetPasswordForEmail(emailVal, {
        redirectTo: `${window.location.origin}${window.location.pathname.replace('/login/', '/admin/')}`
      });

      if (error) {
        showError(error.message);
      } else {
        showSuccess('E-mail de recupera√ß√£o enviado! Verifique sua caixa de entrada.');
        setTimeout(() => successBox.classList.remove('show'), 5000);
      }
    } catch (err) {
      showError('Erro ao enviar e-mail');
      console.error(err);
    } finally {
      btnRecuperar.disabled = false;
      btnRecuperar.innerHTML = 'Recuperar';
    }
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  function showSuccess(msg) {
    successBox.textContent = msg;
    successBox.classList.add('show');
  }

  // Iniciar ao carregar
  initSupabase();
</script>

</body>
</html>
