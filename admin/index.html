<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Painel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #f6f3ee;
      --paper-warm: #ede5dd;
      --detail: #c4c2bd;
      --green: #859b8a;
      --green-dark: #5a695e;
      --pink: #dd8893;
      --pink-dark: #965c64;
      --ink: #000000;
      --gray-light: #e5e5e5;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: white;
      border-right: 1px solid var(--detail);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: fixed;
      left: 0;
      top: 0;
      height: 100%;
      z-index: 100;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--gray-light);
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .sidebar-section {
      padding: 0;
    }

    .sidebar-section-title {
      padding: 12px 20px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--detail);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      color: var(--ink);
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: var(--paper);
    }

    .nav-item.active {
      background: rgba(133, 155, 138, 0.1);
      color: var(--green-dark);
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 20px;
      border-top: 1px solid var(--gray-light);
      font-size: 12px;
    }

    .user-email {
      color: var(--detail);
      margin-bottom: 12px;
      word-break: break-all;
    }

    .btn-logout {
      width: 100%;
      padding: 8px;
      background: var(--detail);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #b3b0ab;
    }

    /* Main content */
    .main {
      margin-left: 250px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: white;
      border-bottom: 1px solid var(--gray-light);
      padding: 20px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* Responsivo: Tablet e Mobile */
    @media (max-width: 768px) {
      .sidebar {
        width: 0;
        transform: translateX(-100%);
        transition: transform 0.3s;
      }

      .sidebar.open {
        width: 250px;
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
      }

      .hamburger {
        display: flex;
      }

      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 99;
      }

      .overlay.show {
        display: block;
      }
    }

    @media (min-width: 769px) {
      .hamburger {
        display: none;
      }

      .overlay {
        display: none !important;
      }
    }

    /* Hamburger menu */
    .hamburger {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--ink);
      margin: 4px 0;
      transition: 0.3s;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    /* Loading e status */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--detail);
    }

    .error-message {
      background: #fee;
      border-left: 3px solid var(--pink);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      color: var(--pink-dark);
      font-size: 13px;
    }

    /* Tabs internos */
    .tabs-nav {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--gray-light);
      padding-bottom: 0;
    }

    .tab-button {
      padding: 12px 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--detail);
      transition: all 0.2s;
    }

    .tab-button.active {
      color: var(--green-dark);
      border-bottom-color: var(--green);
    }

    /* Buttons */
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      background: var(--green-dark);
    }

    .btn-secondary {
      background: var(--detail);
      color: white;
    }

    .btn-secondary:hover {
      background: #b3b0ab;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 12px;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--gray-light);
    }

    .stat-label {
      font-size: 11px;
      color: var(--detail);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--green-dark);
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid var(--gray-light);
      border-radius: 6px;
      overflow: hidden;
    }

    thead {
      background: var(--paper);
      border-bottom: 1px solid var(--gray-light);
    }

    th, td {
      padding: 12px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--gray-light);
    }

    th {
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      color: var(--detail);
    }

    th:hover {
      background: #f0f0f0;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--paper);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-lead { background: #e8f4f8; color: #0066cc; }
    .badge-conversando { background: #fff3e0; color: #f57c00; }
    .badge-cliente { background: #e8f5e9; color: #2e7d32; }
    .badge-parada { background: #f5f5f5; color: #666; }

    .badge-briefing { background: #f5f5f5; color: #666; }
    .badge-roteiro { background: #e3f2fd; color: #1565c0; }
    .badge-aprovacao { background: #f3e5f5; color: #6a1b9a; }
    .badge-gravacao { background: #fff3e0; color: #e65100; }
    .badge-edicao { background: #fce4ec; color: #c2185b; }
    .badge-aprovado { background: #e1f5fe; color: #0277bd; }
    .badge-entregue { background: #e8f5e9; color: #2e7d32; }

    /* Forms */
    input, textarea, select {
      font-family: inherit;
      font-size: 13px;
      padding: 8px;
      border: 1px solid var(--detail);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--green);
      background: white;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    textarea,
    select {
      width: 100%;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 16px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--detail);
    }

    /* Placeholder quando não tem dados */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--detail);
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h2>Admin</h2>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">Meu site</div>
    <button class="nav-item active" data-tab="portfolio">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v20M2 12h20"/>
      </svg>
      Portfólio
    </button>
    <button class="nav-item" data-tab="marcas">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 8 0 4 4 0 0 0-8 0"/>
      </svg>
      Marcas
    </button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">Minha rotina</div>
    <button class="nav-item" data-tab="calendario">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2M3 9h18"/>
      </svg>
      Calendário
    </button>
    <button class="nav-item" data-tab="campanhas">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <path d="M13 2v7h7"/>
      </svg>
      Campanhas
    </button>
    <button class="nav-item" data-tab="checklist">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
      </svg>
      Checklist
    </button>
  </div>

  <div class="sidebar-footer">
    <div class="user-email" id="userEmail">Carregando...</div>
    <button class="btn-logout" id="btnLogout">Sair</button>
  </div>
</div>

<div id="overlay" class="overlay"></div>

<div class="main">
  <div class="header">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1 id="pageTitle">Portfólio</h1>
      <div style="width: 40px;"></div>
    </div>
  </div>

  <div class="content">
    <!-- Será preenchido por JavaScript -->
  </div>
</div>

<!-- Supabase via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0"></script>

<!-- Configuração do banco -->
<script src="../js/banco.js"></script>

<!-- Biblioteca de checklist -->
<script src="../js/biblioteca.js"></script>

<!-- Lógica do painel -->
<script>
  let supabase = null;
  let currentUser = null;
  let currentTab = 'portfolio';

  // ========================================================================
  // INICIALIZAÇÃO
  // ========================================================================

  async function initAdmin() {
    // Inicializar Supabase
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Verificar sessão
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = '../login/';
      return;
    }

    currentUser = session.user;
    document.getElementById('userEmail').textContent = currentUser.email;

    // Configurar listeners
    setupNavigation();
    setupLogout();
    setupResponsive();

    // Carregar primeira aba
    loadTab('portfolio');
  }

  // ========================================================================
  // NAVEGAÇÃO
  // ========================================================================

  function setupNavigation() {
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        loadTab(tab);
      });
    });
  }

  function loadTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

    const titles = {
      portfolio: 'Portfólio',
      marcas: 'Marcas',
      calendario: 'Calendário',
      campanhas: 'Campanhas',
      checklist: 'Checklist'
    };

    document.getElementById('pageTitle').textContent = titles[tab];
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('sidebar').classList.remove('open');

    const content = document.querySelector('.content');
    content.innerHTML = '<div class="loading">Carregando...</div>';

    // Carregar conteúdo da aba
    if (tab === 'portfolio') loadPortfolio();
    else if (tab === 'marcas') loadMarcas();
    else if (tab === 'calendario') loadCalendario();
    else if (tab === 'campanhas') loadCampanhas();
    else if (tab === 'checklist') loadChecklist();
  }

  // ========================================================================
  // LOGOUT
  // ========================================================================

  function setupLogout() {
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '../login/';
    });
  }

  // ========================================================================
  // RESPONSIVO
  // ========================================================================

  function setupResponsive() {
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', () => {
      hamburger.classList.remove('active');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  }

  // ========================================================================
  // ABA 1: PORTFÓLIO
  // ========================================================================

  async function loadPortfolio() {
    const content = document.querySelector('.content');

    try {
      // Buscar vídeos
      const { data: videos, error: videoError } = await supabase
        .from('videos')
        .select('*')
        .order('ordem', { ascending: true });

      if (videoError) throw videoError;

      // Buscar visitas dos últimos 14 dias
      const dataAte14dias = new Date();
      dataAte14dias.setDate(dataAte14dias.getDate() - 14);

      const { data: visitas, error: visitaError } = await supabase
        .from('visitas')
        .select('*')
        .gte('data', dataAte14dias.toISOString());

      if (visitaError) throw visitaError;

      // Contar visitas de hoje
      const hoje = new Date().toISOString().split('T')[0];
      const visitasHoje = visitas.filter(v => v.data.startsWith(hoje)).length;

      // Calcular nicho mais forte
      const nichoCounts = {};
      (videos || []).forEach(v => {
        if (v.visivel) nichoCounts[v.nicho] = (nichoCounts[v.nicho] || 0) + 1;
      });
      const nicoForteLista = Object.entries(nichoCounts).sort((a, b) => b[1] - a[1]);
      const nicoForte = nicoForteLista.length > 0 ? nicoForteLista[0][0] : 'Nenhum';

      // Origem mais comum
      const origemCounts = {};
      (visitas || []).forEach(v => {
        if (v.de_onde) origemCounts[v.de_onde] = (origemCounts[v.de_onde] || 0) + 1;
      });
      const origemForteLista = Object.entries(origemCounts).sort((a, b) => b[1] - a[1]);
      const origemForte = origemForteLista.length > 0 ? origemForteLista[0][0] : 'Nenhuma';

      // Renderizar
      let html = `
        <div class="stats-bar">
          <div class="stat-card">
            <div class="stat-label">Visitas (14 dias)</div>
            <div class="stat-value">${visitas.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Visitas hoje</div>
            <div class="stat-value">${visitasHoje}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Vídeos no ar</div>
            <div class="stat-value">${(videos || []).filter(v => v.visivel).length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Nicho mais forte</div>
            <div class="stat-value">${nicoForte}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Origem top</div>
            <div class="stat-value">${origemForte}</div>
          </div>
        </div>
      `;

      // Gráfico de barras (simplificado)
      html += '<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 14px;">Visitas nos últimos 14 dias</h3>';
      if (visitas.length === 0) {
        html += '<div class="empty-state">Nenhuma visita ainda. Quando pessoas começarem a visitar seu portfólio, este gráfico vai mostrar a atividade por dia.</div>';
      } else {
        html += '<p style="font-size: 13px; color: var(--detail); margin-bottom: 12px;">Gráfico básico de visitas por dia</p>';
      }

      // Origem das visitas
      html += '<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 14px;">De onde as pessoas vêm</h3>';
      if (origemForteLista.length === 0) {
        html += '<div class="empty-state">Ainda não há dados de origem. Isso vai aparecer conforme as pessoas visitarem seu portfólio.</div>';
      } else {
        html += '<ul style="font-size: 13px; list-style: none;">';
        origemForteLista.forEach(([origem, count]) => {
          html += `<li style="padding: 8px 0; border-bottom: 1px solid var(--gray-light);">${origem} <strong>${count}</strong></li>`;
        });
        html += '</ul>';
      }

      // Tabela de vídeos
      html += '<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 14px;">Seus vídeos</h3>';
      html += '<div style="margin-bottom: 12px;"><button class="btn btn-primary" onclick="openVideoModal()">+ Adicionar vídeo</button></div>';

      if (!videos || videos.length === 0) {
        html += '<div class="empty-state">Nenhum vídeo ainda. Adicione um para começar!</div>';
      } else {
        html += `
          <table>
            <thead>
              <tr>
                <th style="width: 30px;"></th>
                <th>Marca</th>
                <th>Nicho</th>
                <th style="width: 60px;">Ações</th>
              </tr>
            </thead>
            <tbody>
        `;
        videos.forEach((v, i) => {
          html += `
            <tr>
              <td style="cursor: move;" draggable="true">☰</td>
              <td>${v.marca || 'Sem marca'}</td>
              <td>${v.nicho}</td>
              <td>
                <button class="btn btn-sm btn-secondary" onclick="toggleVideo(${v.id}, ${!v.visivel})">${v.visivel ? '👁️' : '👁️‍🗨️'}</button>
                <button class="btn btn-sm btn-secondary" onclick="editVideo(${v.id})">✎</button>
                <button class="btn btn-sm btn-secondary" onclick="deleteVideo(${v.id})">✕</button>
              </td>
            </tr>
          `;
        });
        html += `</tbody></table>`;
      }

      content.innerHTML = html;
    } catch (err) {
      content.innerHTML = `<div class="error-message">Erro ao carregar portfólio: ${err.message}</div>`;
      console.error(err);
    }
  }

  // Placeholder: funções de vídeo
  function toggleVideo(id, visivel) {
    alert(`Alternar vídeo ${id} para ${visivel ? 'visível' : 'oculto'}`);
  }

  function editVideo(id) {
    alert(`Editar vídeo ${id}`);
  }

  function deleteVideo(id) {
    if (confirm('Deletar este vídeo?')) {
      alert(`Deletado vídeo ${id}`);
    }
  }

  function openVideoModal() {
    alert('Adicionar novo vídeo');
  }

  // ========================================================================
  // ABA 2: MARCAS
  // ========================================================================

  async function loadMarcas() {
    const content = document.querySelector('.content');

    try {
      const { data: marcas, error } = await supabase
        .from('marcas')
        .select('*')
        .order('criado_em', { ascending: false });

      if (error) throw error;

      let html = '<div style="margin-bottom: 12px; display: flex; gap: 8px;">';
      html += '<button class="btn btn-primary" onclick="openMarcaModal()">+ Adicionar</button>';
      html += '<button class="btn btn-secondary" onclick="downloadCSV()">↓ Baixar CSV</button>';
      html += '</div>';

      if (!marcas || marcas.length === 0) {
        html += '<div class="empty-state">Nenhuma marca ainda. Adicione uma ou ela será criada quando alguém preencher o formulário do seu portfólio.</div>';
      } else {
        html += `
          <table>
            <thead>
              <tr>
                <th>Marca</th>
                <th>Instagram</th>
                <th>E-mail</th>
                <th>Situação</th>
                <th style="width: 80px;">Ações</th>
              </tr>
            </thead>
            <tbody>
        `;
        marcas.forEach(m => {
          const badgeClass = `badge-${m.situacao.toLowerCase()}`;
          html += `
            <tr>
              <td>${m.nome}</td>
              <td><a href="https://instagram.com/${m.instagram}" target="_blank" style="color: var(--green);">${m.instagram || '-'}</a></td>
              <td>${m.email || '-'}</td>
              <td><span class="badge ${badgeClass}">${m.situacao}</span></td>
              <td>
                <button class="btn btn-sm btn-secondary" onclick="editMarca(${m.id})">✎</button>
                <button class="btn btn-sm btn-secondary" onclick="deleteMarca(${m.id})">✕</button>
              </td>
            </tr>
          `;
        });
        html += `</tbody></table>`;
      }

      content.innerHTML = html;
    } catch (err) {
      content.innerHTML = `<div class="error-message">Erro ao carregar marcas: ${err.message}</div>`;
      console.error(err);
    }
  }

  function openMarcaModal() { alert('Adicionar marca'); }
  function editMarca(id) { alert(`Editar marca ${id}`); }
  function deleteMarca(id) {
    if (confirm('Deletar esta marca?')) {
      alert(`Deletado marca ${id}`);
    }
  }
  function downloadCSV() { alert('Baixando CSV...'); }

  // ========================================================================
  // ABA 3: CALENDÁRIO
  // ========================================================================

  async function loadCalendario() {
    const content = document.querySelector('.content');
    content.innerHTML = '<div class="empty-state">Seção de Calendário em desenvolvimento</div>';
  }

  // ========================================================================
  // ABA 4: CAMPANHAS
  // ========================================================================

  async function loadCampanhas() {
    const content = document.querySelector('.content');

    try {
      const { data: campanhas, error } = await supabase
        .from('campanhas')
        .select('*')
        .order('prazo', { ascending: true });

      if (error) throw error;

      // Stats
      const ativas = (campanhas || []).filter(c => c.ativa).length;
      const totalValor = (campanhas || []).reduce((sum, c) => sum + (c.valor || 0), 0);
      const recebido = (campanhas || []).filter(c => c.pagamento === 'Pago').reduce((sum, c) => sum + (c.valor || 0), 0);
      const aReceber = totalValor - recebido;

      let html = `
        <div class="stats-bar">
          <div class="stat-card">
            <div class="stat-label">Total de campanhas</div>
            <div class="stat-value">${campanhas?.length || 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Ativas</div>
            <div class="stat-value">${ativas}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Valor total</div>
            <div class="stat-value">R$ ${totalValor.toFixed(0)}</div>
            <div style="font-size: 11px; color: var(--detail); margin-top: 4px;">Ticket médio: R$ ${campanhas?.length > 0 ? (totalValor / campanhas.length).toFixed(0) : 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">A receber</div>
            <div class="stat-value">R$ ${aReceber.toFixed(0)}</div>
            <div style="font-size: 11px; color: var(--detail); margin-top: 4px;">Já recebido: R$ ${recebido.toFixed(0)}</div>
          </div>
        </div>
      `;

      html += '<div style="margin-bottom: 12px;"><button class="btn btn-primary" onclick="openCampanhaModal()">+ Adicionar</button></div>';

      if (!campanhas || campanhas.length === 0) {
        html += '<div class="empty-state">Nenhuma campanha ainda. Adicione uma para começar a rastrear seus projetos.</div>';
      } else {
        html += `
          <table>
            <thead>
              <tr>
                <th style="width: 30px;">★</th>
                <th>Campanha</th>
                <th>Cliente</th>
                <th>Status</th>
                <th style="width: 60px;">Qtd</th>
                <th>Valor</th>
                <th>Prazo</th>
              </tr>
            </thead>
            <tbody>
        `;
        campanhas.forEach(c => {
          const statusClass = `badge-${c.status.toLowerCase().replace(/\s+/g, '')}`;
          html += `
            <tr>
              <td>${c.favorita ? '★' : '☆'}</td>
              <td>${c.campanha}</td>
              <td>${c.cliente || '-'}</td>
              <td><span class="badge ${statusClass}">${c.status}</span></td>
              <td>${c.qtd}</td>
              <td>R$ ${c.valor.toFixed(2)}</td>
              <td>${c.prazo ? c.prazo : '-'}</td>
            </tr>
          `;
        });
        html += `</tbody></table>`;
      }

      content.innerHTML = html;
    } catch (err) {
      content.innerHTML = `<div class="error-message">Erro ao carregar campanhas: ${err.message}</div>`;
      console.error(err);
    }
  }

  function openCampanhaModal() { alert('Adicionar campanha'); }

  // ========================================================================
  // ABA 5: CHECKLIST
  // ========================================================================

  async function loadChecklist() {
    const content = document.querySelector('.content');

    if (!window.Biblioteca) {
      content.innerHTML = '<div class="error-message">Biblioteca de checklist não carregou. Verifique se js/biblioteca.js está no lugar certo.</div>';
      return;
    }

    content.innerHTML = '<div class="empty-state">Seção de Checklist em desenvolvimento</div>';
  }

  // ========================================================================
  // INICIAR
  // ========================================================================

  initAdmin();
</script>

</body>
